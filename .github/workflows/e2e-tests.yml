name: E2E Tests

on:
  push:
    branches: [main]
    # The committed report itself (e2e/allure-report, e2e/allure-results) does not trigger a run.
    paths:
      - 'e2e/**'
      - '!e2e/allure-report/**'
      - '!e2e/allure-results/**'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-tests
  cancel-in-progress: false

jobs:
  test:
    name: Playwright (API + Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: e2e
    env:
      CI: 'true'
      # URLs default to production in playwright.config.ts; override with repo variables if needed.
      BASE_URL: ${{ vars.BASE_URL }}
      API_URL: ${{ vars.API_URL }}
      # Without these secrets the logged-in tests are skipped; guest + API tests still run.
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test --project=api --project=chromium

      # Masks TEST_USER_* values in allure-results, then builds allure-report.
      - name: Build Allure report (credentials masked)
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      - name: Upload Allure report (artifact)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: e2e/allure-report
          retention-days: 30
